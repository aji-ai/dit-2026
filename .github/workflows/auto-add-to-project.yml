name: Auto-add to project

on:
  issues:
    types: [opened, transferred, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1
        with:
          project-url: https://github.com/orgs/creative-ecologies-lab/projects/1
          github-token: ${{ secrets.GH_PROJECTS_API_KEY }}
